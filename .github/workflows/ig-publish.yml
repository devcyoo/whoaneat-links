name: Instagram auto-publish
on:
  schedule:
    - cron: "*/30 * * * *"      # check the queue every 30 min
  workflow_dispatch:
permissions:
  contents: write
concurrency: ig-publish
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      # IG_TOKEN is a Page access token from a long-lived user token: it does not expire, so no refresh job.
      - name: Publish due Reels
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/ig_publish.py
      - name: Save queue status
        run: |
          git config user.name "whoaneat-bot"
          git config user.email "bot@whoaneat.com"
          git add queue/instagram.json
          git diff --cached --quiet || (git commit -m "ig: update queue status" && git push)
